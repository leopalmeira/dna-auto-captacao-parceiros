services:
  - type: web
    name: dna-auto-captacao-parceiros
    env: node
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD
        generateValue: true
      - key: SESSION_SECRET
        generateValue: true
      - key: INTEGRATION_API_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: dna-auto-leads-db
          property: connectionString

databases:
  - name: dna-auto-leads-db
    databaseName: dna_leads
    user: dna_user
    plan: starter
